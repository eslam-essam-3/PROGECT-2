<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حاسبة القوى الهندسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="image.png">
    <link rel="apple-touch-icon" href="image.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>أدوات هندسة </h1>
    
    <select id="toolType" onchange="toggleInputs()" value="resultant">
        <option value="resultant">حساب المحصلة (R)</option>
        <option value="components">تحليل القوى (X, Y)</option>
        <option value="moment">حساب العزم (Moment)</option>
    </select>
    <div id="inputs"></div>
    <button onclick="runCalculation()">تنفيذ العملية</button>
    <canvas id="myChart" style="max-width: 400px; max-height: 400px; margin: 20px auto;"></canvas>
    <div id="result"></div>
    <div id="historyBox" style="margin-top: 20px; font-size: 0.9em; color: #555;"></div>
</div>
    <script src="script.js"></script>
</body>
</html>
